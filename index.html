<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef4ff; color: #0f172a; padding: 40px; }
    .box { max-width: 900px; margin: auto; display: flex; gap: 30px; align-items: center; flex-wrap: wrap; }
    .info { flex: 1; min-width: 260px; }
    h1 { font-size: 38px; margin-bottom: 12px; }
    p { font-size: 16px; color: #475569; margin-bottom: 20px; line-height: 1.6; }
    .btn { display: inline-block; background: #2563eb; color: #fff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    .photo img { width: 280px; height: 320px; object-fit: cover; border-radius: 20px; background: #fff; padding: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="info">
      <div>DATA & BUSINESS INTELLIGENCE ANALYST</div>
      <h1>From raw data pipelines to clear executive decisions.</h1>
      <p>I design structured data models, automate ETL workflows, and build interactive dashboards using SQL Server, SSIS, Python, Power BI, DAX, and Excel.</p>
      <a class="btn" href="#projects">View My Projects</a>
    </div>
    <div class="photo">
      <img src="Abdallah.png" alt="My Photo" />
    </div>
  </div>
</body>
</html>
