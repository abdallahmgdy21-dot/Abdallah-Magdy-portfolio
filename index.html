<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdallah Magdy | Data Analyst &amp; BI</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    :root {
      --bg-grad: radial-gradient(circle at top right, #ede9fe 0%, #faf8ff 50%, #fff1f2 100%);
      --surface: rgba(255, 255, 255, 0.92);
      --surface-solid: #ffffff;
      --text-main: #1e1b4b;
      --text-muted: #4b5563;
      --primary: #6d28d9;
      --primary-dark: #5b21b6;
      --accent: #f43f5e;
      --soft-pill-bg: #f5f3ff;
      --soft-pill-text: #5b21b6;
      --border: #e9d5ff;
      --shadow: 0 16px 38px rgba(109, 40, 217, 0.08);
    }

    body.dark {
      --bg-grad: radial-gradient(circle at top right, #2e1065 0%, #13111c 55%, #09080f 100%);
      --surface: rgba(30, 27, 46, 0.92);
      --surface-solid: #1e1b2e;
      --text-main: #f5f3ff;
      --text-muted: #c4b5fd;
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --accent: #fb7185;
      --soft-pill-bg: rgba(139, 92, 246, 0.16);
      --soft-pill-text: #ddd6fe;
      --border: #3b3355;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg-grad);
      color: var(--text-main);
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* شاشة عرض الشعار عند فتح الصفحة */
    .splash-screen {
      position: fixed;
      inset: 0;
      background: var(--surface-solid);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 9999;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    .splash-screen.hide {
      opacity: 0;
      visibility: hidden;
    }
    .splash-screen img {
      width: 88px;
      height: 88px;
      object-fit: contain;
    }
    .splash-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.6px;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* الشريط العلوي */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--surface);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 32px;
    }
    .nav-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(109, 40, 217, 0.22);
    }
    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .nav-links a {
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }
    .nav-links a:hover {
      color: var(--primary);
    }
    .theme-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-solid);
      color: var(--text-main);
      cursor: pointer;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* الحاوية الرئيسية */
    .page-wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 40px 32px 70px;
    }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 48px;
      align-items: center;
      min-height: 78vh;
      margin-bottom: 75px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      color: var(--primary);
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .role {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent);
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 48px;
      line-height: 1.14;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
    }
    h1 span {
      color: var(--primary);
    }
    .bio {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-muted);
      margin-bottom: 24px;
      max-width: 550px;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .btn-primary, .btn-secondary {
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(109, 40, 217, 0.25);
    }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-secondary {
      background: var(--surface-solid);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--primary); }

    .stats-row {
      display: flex;
      gap: 32px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .stat-item strong {
      display: block;
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }
    .stat-item span {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* صورة البورتريه */
    .profile-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .outer-frame {
      position: relative;
      background: var(--surface);
      padding: 14px;
      border-radius: 28px;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 390px;
    }
    .inner-frame {
      background: linear-gradient(160deg, #f5f3ff 0%, #fff1f2 100%);
      border-radius: 20px;
      overflow: hidden;
      height: 410px;
    }
    body.dark .inner-frame {
      background: linear-gradient(160deg, #2e1065 0%, #1e1b2e 100%);
    }
    .inner-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .float-badge {
      position: absolute;
      background: var(--surface-solid);
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }
    .badge-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--soft-pill-bg);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }
    .float-top { top: 28px; left: -20px; }
    .float-bottom { bottom: 28px; right: -20px; }
    .float-badge strong { display: block; font-size: 12.5px; }
    .float-badge span { font-size: 11px; color: var(--text-muted); }

    .tools-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }
    .tool-pill {
      background: var(--surface-solid);
      border: 1px solid var(--border);
      color: var(--soft-pill-text);
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* الأقسام */
    .section-kicker {
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .section-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    section {
      scroll-margin-top: 88px;
      margin-bottom: 70px;
    }

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius:
